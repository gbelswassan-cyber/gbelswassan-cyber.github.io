<!DOCTYPE html>
<html lang="sd">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://gbelswassan-cyber.github.io/admission-portal/" />
    <title>Admission Portal | GBELS WASSAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #002d5b; --accent: #8b0000; --whatsapp: #25D366; --btn-dark: #333; }
        body { font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .sindhi { direction: rtl; font-family: 'Noto Naskh Arabic', serif; font-size: 1rem; line-height: 2; }
        .selection-menu { background: #eef6ff; padding: 15px; border: 2px dashed var(--primary); border-radius: 12px; margin-bottom: 15px; text-align: center; width: 100%; max-width: 800px; box-sizing: border-box; }
        .btn-choice { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin: 5px; font-size: 14px; transition: 0.3s; }
        .btn-manual { background: var(--btn-dark); }
        .btn-online { background: var(--primary); }
        .page-border { background: white; width: 210mm; min-height: 297mm; padding: 10mm; border: 3px solid var(--primary); box-shadow: 0 0 20px rgba(0,0,0,0.2); position: relative; box-sizing: border-box; }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
        .logo { width: 85px; height: 85px; border-radius: 50%; border: 1px solid #ddd; }
        .school-info { text-align: center; flex: 1; padding: 0 10px; }
        .school-info h1 { margin: 0; color: var(--primary); font-size: 17px; text-transform: uppercase; font-weight: 800; }
        .school-info p { margin: 2px 0; font-size: 10px; font-weight: 600; color: #333; }
        .admission-tag { font-size: 12px; color: var(--accent); font-weight: bold; border: 1.5px solid #000; padding: 3px 15px; display: inline-block; margin-top: 5px; border-radius: 4px; }
        .photo-box { width: 90px; height: 110px; border: 2px dashed #555; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; background: #fdfdfd; font-weight: bold; overflow: hidden; position: relative; cursor: pointer; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .section { border: 1.2px solid #000; padding: 15px 10px 8px 10px; border-radius: 5px; margin-bottom: 15px; position: relative; }
        .section-label { position: absolute; top: -10px; left: 12px; background: white; padding: 0 8px; font-weight: 800; font-size: 11px; color: var(--accent); text-transform: uppercase; }
        .row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .field { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
        label { font-weight: bold; font-size: 11px; margin-bottom: 3px; color: #222; }
        input, select { padding: 8px; border: 1px solid #999; border-radius: 4px; font-size: 13px; background: #fff; }
        .office-section { border: 1.5px solid var(--primary); padding: 12px; background: #f9f9f9; border-radius: 6px; margin-top: 15px; }
        .office-title { text-align: center; font-weight: 900; text-decoration: underline; margin-bottom: 10px; font-size: 13px; }
        .signature-row { display: flex; justify-content: space-between; margin-top: 30px; }
        .sig-line { border-top: 1.2px solid #000; width: 170px; text-align: center; font-size: 11px; font-weight: bold; padding-top: 4px; }
        .btn-submit { background: var(--whatsapp); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; margin: 10px 0; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        @media print {
            @page { size: A4; margin: 0; }
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            .page-border { border: 2px solid var(--primary); box-shadow: none; width: 100%; height: 100%; margin: 0; padding: 10mm; }
            input, select { border: none; border-bottom: 1px solid #000; background: transparent; }
            select option[value=""] { display: none; }
            input::placeholder { color: transparent; }
        }
    </style>
</head>
<body>
