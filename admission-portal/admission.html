<!DOCTYPE html>
<html lang="sd">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Friendly Admission | GBELS WASSAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #002d5b; --accent: #8b0000; --whatsapp: #25D366; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 5px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* موبائل لاءِ ڪنٽينر جي سيٽنگ */
        .page-border { 
            background: white; 
            width: 100%; 
            max-width: 800px; 
            padding: 15px; 
            border: 1px solid var(--primary); 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            box-sizing: border-box; 
            margin-top: 10px;
        }

        .header { 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid #000; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
        }

        .logo { width: 50px; height: 50px; }
        
        .school-info { text-align: center; flex: 1; padding: 0 5px; }
        .school-info h1 { margin: 0; font-size: 13px; color: var(--primary); line-height: 1.2; }
        .school-info p { margin: 2px 0; font-size: 9px; font-weight: bold; }
        
        .photo-box { 
            width: 65px; 
            height: 80px; 
            border: 1px solid #000; 
            background: #fdfdfd;
            font-size: 8px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Responsive Rows: موبائل تي هڪ ٻئي جي هيٺان ايندا */
        .row { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            margin-bottom: 10px; 
        }
        
        .field { 
            flex: 1; 
            min-width: 140px; /* موبائل تي جڳهه گهٽ هجڻ ڪري سيٽنگ */
            display: flex; 
            flex-direction: column; 
        }

        label { font-weight: bold; font-size: 11px; margin-bottom: 3px; color: #333; }
        input, select { 
            padding: 10px; 
            border: 1px solid #999; 
            border-radius: 5px; 
            font-size: 14px; /* موبائل تي لکڻ ۾ آساني لاءِ سائيز وڌائي وئي آهي */
        }

        /* Documents Section */
        .doc-row { 
            display: flex; 
            flex-direction: column; 
            margin-bottom: 10px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 5px; 
        }
        .doc-label { font-size: 11px; font-weight: bold; margin-bottom: 5px; }
        .doc-input { font-size: 12px; }

        .btn-submit { 
            background: var(--whatsapp); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            width: 100%; 
            font-size: 16px; 
            cursor: pointer; 
        }

        .office-box { 
            border: 1px solid var(--primary); 
            padding: 10px; 
            background: #f9fcff; 
            margin-top: 15px;
        }

        .sig-row { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 30px; 
            text-align: center;
        }
        .sig-item { border-top: 1px solid #000; width: 30%; font-size: 9px; font-weight: bold; }

        /* پرنٽ سيٽنگ: پرنٽ ۾ اي4 سائيز ئي رهندي */
        @media print {
            body { padding: 0; background: white; }
            .no-print { display: none !important; }
            .page-border { border: 1px solid #000; box-shadow: none; width: 210mm; padding: 10mm; }
            .row { flex-wrap: nowrap; }
            .field { min-width: auto; }
            .doc-row { flex-direction: row; align-items: center; }
        }
    </style>
</head>
<body>

<div class="page-border">
    <div class="header">
        <img src="https://gbelswassan-cyber.github.io/logo.png.png" class="logo">
        <div class="school-info">
            <h1>GBELS WASSAN</h1>
            <p style="font-size: 8px;">Taluka & District Naushahro Feroze</p>
            <div style="font-size: 10px; font-weight: bold; border: 1px solid #000; margin-top: 4px;">ADMISSION FORM 2026-27</div>
        </div>
        <div class="photo-box">Photo</div>
    </div>

    <form id="admissionForm">
        <div class="row">
            <div class="field"><label>Student Name:</label><input type="text" placeholder="Enter Name"></div>
            <div class="field"><label>Father Name:</label><input type="text" placeholder="Enter Father Name"></div>
        </div>

        <div class="row">
            <div class="field"><label>Caste:</label><input type="text" placeholder="Caste"></div>
            <div class="field"><label>B-Form No:</label><input type="text" placeholder="45304-xxxxxxx-x"></div>
        </div>

        <div class="row">
            <div class="field"><label>Class Required:</label><input type="text" placeholder="e.g. Class 6th"></div>
            <div class="field"><label>WhatsApp No:</label><input type="text" placeholder="0300-xxxxxxx"></div>
        </div>

        <div style="margin: 15px 0; font-size: 12px; font-weight: bold; color: var(--accent);">DOCUMENTS UPLOAD:</div>
        
        <div class="doc-row">
            <span class="doc-label">B-Form Copy:</span>
            <input type="file" class="doc-input">
        </div>
        <div class="doc-row">
            <span class="doc-label">Father CNIC:</span>
            <input type="file" class="doc-input">
        </div>

        <button type="button" class="btn-submit no-print">Submit & Send WhatsApp ✅</button>

        <div class="office-box">
            <div style="text-align: center; font-size: 10px; font-weight: bold; margin-bottom: 10px;">FOR OFFICE USE ONLY</div>
            <div class="row">
                <div class="field"><label>G.R No:</label><input type="text" readonly></div>
                <div class="field"><label>Date:</label><input type="text" readonly></div>
            </div>
            <div class="sig-row">
                <div class="sig-item">Teacher</div>
                <div class="sig-item">Incharge</div>
                <div class="sig-item">Head Master</div>
            </div>
        </div>
    </form>
</div>

</body>
</html>
