<!DOCTYPE html>
<html lang="sd">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Portal | GBELS WASSAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #002d5b; --accent: #8b0000; --whatsapp: #25D366; --btn-dark: #333; }
        
        body { font-family: 'Poppins', 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .sindhi { direction: rtl; font-family: 'Noto Naskh Arabic', serif; font-size: 1rem; line-height: 1.8; }

        /* موبائل لاءِ بهتري */
        .selection-menu { background: #eef6ff; padding: 15px; border: 2px dashed var(--primary); border-radius: 12px; margin-bottom: 15px; text-align: center; width: 95%; max-width: 800px; box-sizing: border-box; }
        
        /* PDF ۽ فارم جي بناوت جيڪا هڪ پيج تي فٽ اچي */
        .page-border { 
            background: white; 
            width: 100%; 
            max-width: 210mm; 
            padding: 8mm; 
            border: 3px solid var(--primary); 
            box-shadow: 0 0 20px rgba(0,0,0,0.1); 
            position: relative; 
            box-sizing: border-box; 
            margin-bottom: 20px;
        }

        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px; }
        .logo { width: 70px; height: 70px; border-radius: 50%; }
        .school-info { text-align: center; flex: 1; }
        .school-info h1 { margin: 0; color: var(--primary); font-size: 14px; font-weight: 800; }
        .school-info p { margin: 2px 0; font-size: 9px; font-weight: 600; }
        
        .admission-tag { font-size: 10px; color: var(--accent); font-weight: bold; border: 1.5px solid #000; padding: 2px 8px; display: inline-block; border-radius: 4px; }
        
        .photo-box { width: 80px; height: 95px; border: 2px dashed #555; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 8px; background: #fdfdfd; font-weight: bold; overflow: hidden; cursor: pointer; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }

        /* سيڪشن جي فاصلي ۾ گهٽتائي ته پيج تي فٽ اچي */
        .section { border: 1.2px solid #000; padding: 12px 10px 5px 10px; border-radius: 5px; margin-bottom: 10px; position: relative; }
        .section-label { position: absolute; top: -10px; left: 12px; background: white; padding: 0 8px; font-weight: 800; font-size: 10px; color: var(--accent); }

        .row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .field { flex: 1; display: flex; flex-direction: column; min-width: 130px; }
        label { font-weight: bold; font-size: 10px; margin-bottom: 2px; }
        input, select { padding: 6px; border: 1px solid #999; border-radius: 4px; font-size: 12px; width: 100%; box-sizing: border-box; }

        .office-section { border: 1.5px solid var(--primary); padding: 8px; background: #f9f9f9; border-radius: 6px; margin-top: 10px; }
        .office-title { text-align: center; font-weight: 900; font-size: 11px; text-decoration: underline; margin-bottom: 5px; }

        .signature-row { display: flex; justify-content: space-between; margin-top: 20px; }
        .sig-line { border-top: 1.2px solid #000; width: 45%; text-align: center; font-size: 9px; font-weight: bold; padding-top: 3px; }

        .btn-submit { background: var(--whatsapp); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; margin: 10px 0; }
        
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; }
            .page-border { border: 2px solid var(--primary); box-shadow: none; margin: 0; padding: 5mm; }
        }
    </style>
</head>
<body>

<div class="selection-menu no-print">
    <p class="sindhi" style="margin:0 0 10px 0; font-weight:bold; color:var(--primary);">داخلا پورٽل (GBELS WASSAN)</p>
    <button class="btn-choice btn-manual" style="background:#333; color:white; padding:10px; border-radius:5px; border:none; cursor:pointer;" onclick="downloadManualForm()">Manual Form (Download PDF) 🖨️</button>
</div>

<div class="page-border" id="printable-area">
    <div class="header">
        <img src="https://gbelswassan-cyber.github.io/logo.png.png" class="logo" alt="Logo">
        <div class="school-info">
            <h1>GOVERNMENT BOYS ELEMENTARY LOWER SECONDARY SCHOOL WASSAN</h1>
            <p>Village Muhammad Sharif Wassan, Naushahro Feroze</p>
            <span class="admission-tag">ADMISSION FORM (2026-2027)</span>
        </div>
        <div class="photo-box" onclick="document.getElementById('student_img').click()">
            <span id="photo-txt">Photo</span>
            <img id="preview" style="display:none">
            <input type="file" id="student_img" accept="image/*" style="display:none" onchange="showPreview(this)">
        </div>
    </div>

    <form id="admissionForm">
        <div class="section">
            <span class="section-label">1. STUDENT INFORMATION</span>
            <div class="row">
                <div class="field"><label>Student Name:</label><input type="text" id="s_name" required></div>
                <div class="field"><label>Father's Name:</label><input type="text" id="f_name" required></div>
            </div>
            <div class="row">
                <div class="field"><label>Caste:</label><input type="text" id="caste" required></div>
                <div class="field"><label>DOB:</label><input type="date" id="dob" required></div>
                <div class="field"><label>Gender:</label><select id="gender"><option>Male</option><option>Female</option></select></div>
            </div>
            <div class="row">
                <div class="field"><label>B-Form / CNIC:</label><input type="text" id="cnic" required></div>
                <div class="field"><label>Religion:</label><input type="text" id="religion"></div>
            </div>
        </div>

        <div class="section">
            <span class="section-label">2. ACADEMIC & CONTACT</span>
            <div class="row">
                <div class="field"><label>Class Required:</label><input type="text" id="adm_class" required></div>
                <div class="field"><label>WhatsApp No:</label><input type="text" id="phone" required></div>
            </div>
            <div class="row">
                <div class="field"><label>Address:</label><input type="text" id="address" required></div>
            </div>
        </div>

        <div class="office-section">
            <div class="office-title">FOR OFFICE USE ONLY</div>
            <div class="row">
                <div class="field"><label>Granted Class:</label><input type="text"></div>
                <div class="field"><label>GRN No:</label><input type="text"></div>
                <div class="field"><label>Fee Paid:</label><input type="text"></div>
            </div>
        </div>

        <div class="signature-row">
            <div class="sig-line">Parent Signature</div>
            <div class="sig-line">Headmaster Signature</div>
        </div>
    </form>
</div>

<div class="no-print" style="width:100%; max-width:800px; padding:10px;">
    <button type="button" id="submitBtn" class="btn-submit" onclick="handleUpload()">Apply Online & Send WhatsApp ✅</button>
    <p id="status" style="text-align:center; font-weight:bold; color:var(--primary);"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
    function showPreview(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('photo-txt').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // پي ڊي ايف کي هڪ پيج تي فٽ ڪرڻ وارو فنڪشن
    function downloadManualForm() {
        const element = document.getElementById('printable-area');
        const opt = {
            margin: 5,
            filename: 'GBELS_WASSAN_Form.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // توهان جو پراڻو ڊيٽا موڪلڻ وارو سسٽم (بلڪل محفوظ)
    async function handleUpload() {
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        const s_name = document.getElementById('s_name').value;
        const cnic = document.getElementById('cnic').value;

        if(!s_name || !cnic) {
            alert("Please enter Name and CNIC!");
            return;
        }

        btn.disabled = true;
        status.innerText = "ڊيٽا موڪلي پئي وڃي...";

        const payload = {
            s_name: s_name,
            f_name: document.getElementById('f_name').value,
            phone: document.getElementById('phone').value,
            caste: document.getElementById('caste').value,
            dob: document.getElementById('dob').value,
            gender: document.getElementById('gender').value,
            cnic: cnic,
            adm_class: document.getElementById('adm_class').value,
            address: document.getElementById('address').value
        };

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZezVuYD_y0PFSUv-Sq5aQvrwetrXQIPIy6KRN8ObJZtUh05PUzIxjCBuAOrPU3IIp/exec";

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                mode: 'no-cors'
            });
            status.innerText = "ڊيٽا محفوظ ٿي وئي! WhatsApp کلي رهيو آهي...";
            sendToWA(payload);
        } catch (e) {
            sendToWA(payload);
        }
    }

    function sendToWA(data) {
        const msg = `*GBELS WASSAN ADMISSION*%0Aشاگرد: ${data.s_name}%0Aڪلاس: ${data.adm_class}%0Aڊيٽا جمع ٿي وئي. ✅`;
        window.open(`https://wa.me/923008909756?text=${msg}`, '_blank');
        document.getElementById('submitBtn').disabled = false;
    }
</script>
</body>
</html>
