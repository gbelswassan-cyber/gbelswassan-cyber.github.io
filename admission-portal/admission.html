<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-dark: #1e1e1e;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
            --accent-red: #e74c3c;
            --accent-orange: #f39c12;
            --text-white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            margin: 0;
            padding: 0;
        }

        /* Header Style */
        .header {
            background-color: var(--panel-dark);
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-green);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }

        /* Dashboard Buttons Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-card {
            background: var(--panel-dark);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #333;
            transition: 0.3s;
        }

        .menu-card:active { transform: scale(0.95); }
        .menu-card i { font-size: 24px; display: block; margin-bottom: 5px; }
        
        .bg-green { border-bottom: 4px solid var(--accent-green); }
        .bg-blue { border-bottom: 4px solid var(--accent-blue); }
        .bg-orange { border-bottom: 4px solid var(--accent-orange); }
        .bg-red { border-bottom: 4px solid var(--accent-red); }

        /* Form Styling */
        .form-section {
            background: var(--panel-dark);
            padding: 20px;
            border-radius: 15px;
            display: none; 
        }

        .active { display: block; }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .main-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Search Bar */
        .search-area {
            display: flex;
            gap: 5px;
        }
        .search-area input { flex: 2; }
        .search-area button { flex: 1; background: var(--accent-orange); border:none; border-radius:8px; color:white; cursor: pointer;}

        #searchResult {
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

    </style>
</head>
<body>

<div class="header">ايڊميشن پورٽل</div>

<div class="container">
    
    <div class="menu-grid">
        <div class="menu-card bg-green" onclick="openSection('manual')">
            📄<br>Manual Form
        </div>
        <div class="menu-card bg-blue" onclick="openSection('online')">
            🌐<br>Online Apply
        </div>
        <div class="menu-card bg-red" onclick="openSection('print-online')">
            🖨️<br>Print Form
        </div>
        <div class="menu-card bg-orange" onclick="openSection('search')">
            🔍<br>Search Record
        </div>
    </div>

    <div id="search" class="form-section">
        <h3>🔍 ريڪارڊ ڳوليو</h3>
        <div class="search-area">
            <input type="text" id="searchId" placeholder="B-Form / CNIC نمبر هڻو">
            <button onclick="searchData()">ڳوليو</button>
        </div>
        <div id="searchResult"></div>
    </div>

    <div id="form-container" class="form-section">
        <h3 id="form-title">داخلا فارم</h3>
        <form id="admissionForm">
            <input type="text" name="s_name" id="s_name" placeholder="شاگرد جو نالو" required>
            <input type="text" name="f_name" id="f_name" placeholder="پيءُ جو نالو" required>
            <input type="text" name="cnic" id="cnic" placeholder="B-Form / CNIC نمبر" required>
            <select name="class" id="class">
                <option value="1">ڪلاس 1</option>
                <option value="2">ڪلاس 2</option>
                <option value="3">ڪلاس 3</option>
                <option value="4">ڪلاس 4</option>
                <option value="5">ڪلاس 5</option>
            </select>
            <input type="tel" name="phone" id="phone" placeholder="موبائل نمبر">
            
            <button type="button" id="submitBtn" class="main-btn" onclick="handleAction()" style="background: var(--accent-blue);">سبمٽ ڪريو</button>
        </form>
    </div>

</div>

<script>
    let currentMode = "";
    // توھان جي گوگل اسڪرپٽ ويب يو آر ايل
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSAKtUa6CbUgyYJuIEadXN56jIGVuporFE6KwD5erNWCjem1U_aQ-Y3i6ng00fXA80Kg/exec";

    function openSection(section) {
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        
        if(section === 'search') {
            document.getElementById('search').classList.add('active');
        } else {
            document.getElementById('form-container').classList.add('active');
            currentMode = section;
            
            const btn = document.getElementById('submitBtn');
            const title = document.getElementById('form-title');

            if(section === 'manual') {
                title.innerText = "Manual Form Entry";
                btn.innerText = "محفوظ ۽ پرنٽ ڪريو";
                btn.style.background = "var(--accent-green)";
            } else if(section === 'online') {
                title.innerText = "Online Application";
                btn.innerText = "آن لائن اپلاءِ ڪريو";
                btn.style.background = "var(--accent-blue)";
            } else if(section === 'print-online') {
                title.innerText = "Download/Print Form";
                btn.innerText = "پرنٽ ڪيو";
                btn.style.background = "var(--accent-red)";
            }
        }
    }

    function handleAction() {
        const name = document.getElementById('s_name').value;
        if(!name) { alert("مهرباني ڪري نالو لکو"); return; }

        if(currentMode === 'online') {
            alert("ڊيٽا موڪلي وئي! واٽس اپ کلي رهيو آهي...");
            window.open("https://wa.me/923000000000?text=نئين داخلا: " + name);
            window.print();
        } else {
            window.print();
            if(currentMode === 'manual') document.getElementById('admissionForm').reset();
        }
    }

    function searchData() {
        const val = document.getElementById('searchId').value;
        const resDiv = document.getElementById('searchResult');
        
        if(!val) { alert("نمبر لکو"); return; }
        
        resDiv.style.color = "orange";
        resDiv.innerText = "ڳولي رهيو آهي... مهرباني ڪري انتظار ڪريو.";
        
        // گوگل اسڪرپٽ کي CNIC موڪلڻ
        fetch(SCRIPT_URL + "?action=search&cnic=" + val)
        .then(response => response.json())
        .then(data => {
            if(data.result === "found" || data.status === "success") {
                resDiv.style.color = "var(--accent-green)";
                let studentName = data.name || (data.data && data.data.name);
                resDiv.innerText = "مستند ريڪارڊ مليو: " + studentName;
                
                // فارم ۾ آٽو فل ڪرڻ
                document.getElementById('s_name').value = studentName || "";
                if(data.f_name || (data.data && data.data.f_name)) {
                    document.getElementById('f_name').value = data.f_name || data.data.f_name;
                }
                document.getElementById('cnic').value = val;
                
                // سرچ بعد فارم سيڪشن کولي ڇڏيو
                setTimeout(() => {
                    openSection('print-online');
                }, 1000);

            } else {
                resDiv.style.color = "var(--accent-red)";
                resDiv.innerText = "ريڪارڊ نه مليو: " + (data.message || "چيڪ ڪريو");
            }
        })
        .catch(error => {
            resDiv.style.color = "var(--accent-red)";
            resDiv.innerText = "ڳولا دوران غلطي ٿي. انٽرنيٽ چيڪ ڪريو.";
            console.error('Error:', error);
        });
    }
</script>

</body>
</html>
