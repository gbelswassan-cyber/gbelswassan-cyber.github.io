<!DOCTYPE html>
<html lang="sd">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Portal | GBELS WASSAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #002d5b; --accent: #8b0000; --whatsapp: #25D366; --btn-dark: #333; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .sindhi { direction: rtl; font-family: 'Noto Naskh Arabic', serif; }
        .selection-menu { background: #eef6ff; padding: 15px; border: 2px dashed var(--primary); border-radius: 12px; margin-bottom: 15px; text-align: center; width: 100%; max-width: 800px; box-sizing: border-box; }
        .btn-choice { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin: 5px; font-size: 14px; }
        .btn-manual { background: var(--btn-dark); }
        .btn-online { background: var(--primary); }
        .page-border { background: white; width: 100%; max-width: 210mm; padding: 8mm; border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(0,0,0,0.2); position: relative; box-sizing: border-box; margin-bottom: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
        .logo { width: 75px; height: 75px; border-radius: 50%; }
        .school-info { text-align: center; flex: 1; padding: 0 10px; }
        .school-info h1 { margin: 0; color: var(--primary); font-size: 15px; text-transform: uppercase; font-weight: 800; }
        .school-info p { margin: 2px 0; font-size: 9px; font-weight: 600; color: #333; }
        .admission-tag { font-size: 10px; color: var(--accent); font-weight: bold; border: 1.5px solid #000; padding: 2px 10px; display: inline-block; margin-top: 5px; border-radius: 4px; }
        .photo-box { width: 85px; height: 100px; border: 2px dashed #555; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 8px; background: #fdfdfd; font-weight: bold; }
        .section { border: 1.2px solid #000; padding: 12px 10px 6px 10px; border-radius: 5px; margin-bottom: 12px; position: relative; }
        .section-label { position: absolute; top: -9px; left: 12px; background: white; padding: 0 8px; font-weight: 800; font-size: 10px; color: var(--accent); text-transform: uppercase; }
        .row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .field { flex: 1; display: flex; flex-direction: column; min-width: 140px; }
        label { font-weight: bold; font-size: 10px; margin-bottom: 2px; color: #222; }
        input, select { padding: 7px; border: 1px solid #999; border-radius: 4px; font-size: 12px; background: #fff; width: 100%; box-sizing: border-box; }
        .btn-submit { background: var(--whatsapp); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; margin: 10px 0; }
        .btn-submit:disabled { background: #999; cursor: not-allowed; }
        #mobile-console { background: #1a1a1a; color: #00ff00; font-family: monospace; padding: 10px; border-radius: 8px; font-size: 11px; width: 100%; max-width: 800px; max-height: 150px; overflow-y: auto; margin-top: 10px; }
        .log-entry { margin-bottom: 2px; border-left: 2px solid #00ff00; padding-left: 5px; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div class="selection-menu no-print">
    <p class="sindhi" style="margin:0 0 10px 0; font-weight:bold; color:var(--primary);">داخلا پورٽل (GBELS WASSAN)</p>
    <button class="btn-choice btn-manual" onclick="window.print()">Manual Form (پرنٽ ڪريو) 🖨️</button>
</div>

<div class="page-border" id="form-start">
    <div class="header">
        <img src="https://gbelswassan-cyber.github.io/logo.png.png" class="logo" alt="Logo">
        <div class="school-info">
            <h1>GOVERNMENT BOYS ELEMENTARY LOWER SECONDARY SCHOOL WASSAN</h1>
            <p>Village Muhammad Sharif Wassan, Naushahro Feroze</p>
            <span class="admission-tag">ADMISSION FORM (2026-2027)</span>
        </div>
        <div class="photo-box">Passport Size<br>Photo Here</div>
    </div>

    <form id="admissionForm">
        <div class="section">
            <span class="section-label">1. STUDENT INFORMATION</span>
            <div class="row">
                <div class="field"><label>Student Name:</label><input type="text" id="s_name" required></div>
                <div class="field"><label>Father's Name:</label><input type="text" id="f_name" required></div>
            </div>
            <div class="row">
                <div class="field"><label>Caste:</label><input type="text" id="caste" required></div>
                <div class="field"><label>Date of Birth:</label><input type="date" id="dob" required></div>
                <div class="field"><label>Gender:</label><select id="gender"><option value="Male">Male</option><option value="Female">Female</option></select></div>
            </div>
            <div class="row">
                <div class="field"><label>B-Form/CNIC:</label><input type="text" id="cnic" required></div>
                <div class="field"><label>Religion:</label><input type="text" id="religion"></div>
            </div>
        </div>

        <div class="section">
            <span class="section-label">2. ACADEMIC & CONTACT</span>
            <div class="row">
                <div class="field"><label>Admission Class:</label><input type="text" id="adm_class" required></div>
                <div class="field"><label>Mobile/WhatsApp:</label><input type="text" id="phone" required></div>
            </div>
            <div class="row">
                <div class="field"><label>Previous School:</label><input type="text" id="prev_school"></div>
                <div class="field"><label>Address:</label><input type="text" id="address" required></div>
            </div>
        </div>

        <div class="section no-print">
            <span class="section-label">3. UPLOAD DOCUMENTS</span>
            <div class="row">
                <div class="field"><label>Photo:</label><input type="file" id="file_Photo"></div>
                <div class="field"><label>B-Form:</label><input type="file" id="file_B-Form"></div>
            </div>
            <div class="row">
                <div class="field"><label>SLC:</label><input type="file" id="file_SLC"></div>
                <div class="field"><label>Father CNIC:</label><input type="file" id="file_Father-CNIC"></div>
            </div>
        </div>

        <button type="button" id="submitBtn" class="btn-submit no-print" onclick="handleSubmit()">آن لائن اپلائي ڪريو ✅</button>
    </form>
</div>

<div id="mobile-console" class="no-print">
    <div class="log-entry">سسٽم تيار آهي...</div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZezVuYD_y0PFSUv-Sq5aQvrwetrXQIPIy6KRN8ObJZtUh05PUzIxjCBuAOrPU3IIp/exec";

    function log(msg) {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerText = `[LOG] ${msg}`;
        document.getElementById('mobile-console').appendChild(div);
    }

    // فائل کي Base64 ۾ تبديل ڪرڻ وارو فنڪشن
    async function getBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) resolve(null);
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function handleSubmit() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        log("ڊيٽا تيار ڪئي پئي وڃي...");

        const docKeys = ["Photo", "B-Form", "SLC", "Father-CNIC"];
        const docs = {};

        for (let key of docKeys) {
            const fileInput = document.getElementById('file_' + key);
            if (fileInput.files.length > 0) {
                log(`${key} اپلوڊ ٿي رهيو آهي...`);
                docs[key] = await getBase64(fileInput.files[0]);
            }
        }

        const payload = {
            s_name: document.getElementById('s_name').value,
            f_name: document.getElementById('f_name').value,
            caste: document.getElementById('caste').value,
            dob: document.getElementById('dob').value,
            gender: document.getElementById('gender').value,
            cnic: document.getElementById('cnic').value,
            religion: document.getElementById('religion').value,
            adm_class: document.getElementById('adm_class').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            prev_school: document.getElementById('prev_school').value,
            docs: docs // اسڪرپٽ لاءِ فائلون
        };

        log("گوگل شيٽ ۾ ڊيٽا موڪلي پئي وڃي...");

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            mode: 'no-cors'
        }).then(() => {
            log("ڊيٽا ڪاميابي سان محفوظ ٿي وئي! ✅");
            alert("فارم ڪاميابي سان جمع ٿي ويو!");
            btn.disabled = false;
        }).catch(err => {
            log("غلطي: " + err);
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
