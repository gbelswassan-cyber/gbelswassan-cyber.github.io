<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مضمون — GBELS Wassan</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Naskh+Arabic:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --ajrak-red:#a52a2a;
            --ajrak-blue:#002d5b;
            --ajrak-gold:#ffcc00;
            --bg-light:#f4f7f9;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:var(--bg-light);
            color:#333;
            line-height:1.8;
        }

        /* ================= NAVBAR ================= */

        nav{
            background:var(--ajrak-blue);
            padding:16px 5%;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            flex-wrap:wrap;
            box-shadow:0 5px 20px rgba(0,0,0,0.25);
            position:sticky;
            top:0;
            z-index:1000;
        }

        .nav-brand{
            color:var(--ajrak-gold);
            font-weight:800;
            font-size:1.1rem;
            text-decoration:none;
            border:2px solid var(--ajrak-gold);
            padding:6px 14px;
            border-radius:6px;
            transition:0.3s;
            white-space:nowrap;
        }

        .nav-brand:hover{
            background:var(--ajrak-gold);
            color:var(--ajrak-blue);
        }

        /* ===== UPDATED BACK BUTTON ===== */

        .back-btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;

            background:transparent;
            color:#fff;

            text-decoration:none;
            font-size:0.95rem;
            font-weight:700;

            border:2px solid rgba(255,255,255,0.8);

            padding:10px 18px;

            border-radius:50px;

            transition:all 0.3s ease;

            min-width:140px;

            direction:rtl;
        }

        .back-btn:hover{
            background:var(--ajrak-gold);
            color:var(--ajrak-blue);
            border-color:var(--ajrak-gold);
            transform:translateY(-2px);
            box-shadow:0 6px 18px rgba(0,0,0,0.25);
        }

        .back-btn span{
            font-size:1rem;
        }

        /* ================= CONTENT ================= */

        .container{
            max-width:900px;
            margin:60px auto;
            padding:0 20px 80px;
        }

        .article-box{
            background:#fff;
            border-radius:22px;
            padding:50px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
            border:1px solid #eee;

            direction:rtl;
            font-family:'Noto Naskh Arabic',serif;
        }

        .article-box h1{
            color:var(--ajrak-blue);
            font-size:2rem;
            margin-bottom:15px;
            line-height:1.6;
            border-bottom:4px solid var(--ajrak-red);
            padding-bottom:15px;
        }

        .article-meta{
            color:#888;
            font-size:1rem;
            margin-bottom:30px;
            font-family:'Poppins',sans-serif;
            text-align:right;
        }

        .article-body{
            font-size:1.2rem;
            line-height:2.5;
            color:#333;
        }

        .article-body p{
            margin-bottom:20px;
            text-align:justify;
        }

        .article-body h2{
            color:var(--ajrak-blue);
            margin:30px 0 10px;
            font-size:1.45rem;
        }

        .article-body ul{
            margin:10px 20px 20px;
        }

        .article-body ul li{
            margin-bottom:10px;
        }

        .not-found{
            text-align:center;
            padding:80px 20px;
            font-family:'Noto Naskh Arabic',serif;
            direction:rtl;
            font-size:1.3rem;
            color:#888;
        }

        /* ================= SHARE ================= */

        .share-bar{
            margin-top:40px;
            padding-top:25px;
            border-top:2px solid #eee;

            display:flex;
            gap:15px;
            flex-wrap:wrap;
            justify-content:flex-end;
        }

        .share-btn{
            display:inline-flex;
            align-items:center;
            gap:8px;

            padding:12px 22px;

            border-radius:50px;

            font-weight:700;
            font-size:1rem;

            text-decoration:none;

            transition:0.3s;

            font-family:'Poppins',sans-serif;
        }

        .share-whatsapp{
            background:#25D366;
            color:#fff;
        }

        .share-whatsapp:hover{
            background:#1da851;
            transform:translateY(-3px);
            box-shadow:0 6px 15px rgba(37,211,102,0.4);
        }

        .share-copy{
            background:var(--ajrak-blue);
            color:#fff;
            cursor:pointer;
            border:none;
        }

        .share-copy:hover{
            background:#003d7a;
            transform:translateY(-3px);
            box-shadow:0 6px 15px rgba(0,45,91,0.3);
        }

        .copy-success{
            background:#28a745 !important;
        }

        /* ================= FOOTER ================= */

        footer{
            background:#000;
            color:#fff;
            padding:40px 20px;
            text-align:center;
            border-top:6px solid var(--ajrak-red);
            font-size:0.9rem;
        }

        .footer-gold{
            color:var(--ajrak-gold);
            font-weight:700;
        }

        /* ================= MOBILE ================= */

        @media (max-width:768px){

            nav{
                padding:14px 4%;
            }

            .nav-brand{
                font-size:0.95rem;
                padding:6px 10px;
            }

            .back-btn{
                min-width:auto;
                padding:9px 14px;
                font-size:0.88rem;
            }

            .article-box{
                padding:25px;
            }

            .article-box h1{
                font-size:1.5rem;
            }

            .article-body{
                font-size:1.1rem;
                line-height:2.2;
            }

            .share-bar{
                justify-content:center;
            }

            .share-btn{
                width:100%;
                justify-content:center;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <a href="index.html" class="nav-brand">
            GBELS WASSAN
        </a>

        <!-- UPDATED BUTTON -->
        <a href="index.html#articles" class="back-btn">
            <span>←</span>
            واپس جائیں
        </a>

    </nav>

    <!-- ================= CONTENT ================= -->

    <div class="container">
        <div id="article-content"></div>
    </div>

    <!-- ================= FOOTER ================= -->

    <footer>
        <span class="footer-gold">
            Government Boys Elementary Lower Secondary School Wassan
        </span>
        <br>
        © 2026 — تمام حقوق محفوظ ہیں
    </footer>

    <!-- ================= SCRIPT ================= -->

    <script>

        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');

        fetch('articles.json')

            .then(res => res.json())

            .then(data => {

                const article = data.find(a => a.id === articleId);

                const container = document.getElementById('article-content');

                if (!article) {

                    container.innerHTML = `
                        <div class="not-found">
                            مضمون نہیں ملا۔ براہ کرم واپس جائیں۔
                        </div>
                    `;

                    return;
                }

                document.title = article.title + ' — GBELS Wassan';

                let bodyHtml = '';

                if(article.fullContent && article.fullContent.length > 0){

                    article.fullContent.forEach(block => {

                        if(block.type === 'heading'){

                            bodyHtml += `<h2>${block.text}</h2>`;

                        }else if(block.type === 'list'){

                            bodyHtml += `
                                <ul>
                                    ${block.items.map(i => `<li>${i}</li>`).join('')}
                                </ul>
                            `;

                        }else{

                            bodyHtml += `<p>${block.text}</p>`;
                        }

                    });

                }else{

                    bodyHtml = `<p>${article.description}</p>`;
                }

                const shareText = encodeURIComponent(
                    '📚 ' + article.title + ' — GBELS Wassan\n' + window.location.href
                );

                container.innerHTML = `

                    <div class="article-box">

                        <h1>${article.title}</h1>

                        <div class="article-meta">
                            📅 ${article.dateDisplay || article.date}
                        </div>

                        <div class="article-body">
                            ${bodyHtml}
                        </div>

                        <div class="share-bar">

                            <a class="share-btn share-whatsapp"
                               href="https://wa.me/?text=${shareText}"
                               target="_blank">

                               📲 واٹس ایپ پر شیئر کریں

                            </a>

                            <button class="share-btn share-copy"
                                    id="copyBtn"
                                    onclick="copyLink()">

                                🔗 لنک کاپی کریں

                            </button>

                        </div>

                    </div>

                `;
            })

            .catch(() => {

                document.getElementById('article-content').innerHTML = `
                    <div class="not-found">
                        ڈیٹا لوڈ نہیں ہو سکا۔ دوبارہ کوشش کریں۔
                    </div>
                `;
            });

        function copyLink(){

            navigator.clipboard.writeText(window.location.href)

                .then(() => {

                    const btn = document.getElementById('copyBtn');

                    btn.textContent = '✅ لنک کاپی ہو گیا!';

                    btn.classList.add('copy-success');

                    setTimeout(() => {

                        btn.textContent = '🔗 لنک کاپی کریں';

                        btn.classList.remove('copy-success');

                    },2500);
                });
        }

    </script>

</body>
</html>
